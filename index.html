<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verhältnisaufgaben – Teile oben, Wert darunter</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  body{margin:0;background:#f4f4f4;display:flex;justify-content:center}
  .app{
    background:#fff;max-width:980px;width:100%;
    margin:12px;padding:12px;border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  h1{margin:6px 0 12px;text-align:center;font-size:18px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .meta,.score{font-size:12px;color:#555;font-weight:900}

  .card{margin-top:10px;border:1px solid #e5e5e5;border-radius:12px;padding:12px;background:#fff}
  .cat{font-size:12px;font-weight:1000;color:#444;margin-bottom:6px}
  .title{font-weight:1000;font-size:16px;margin-bottom:8px}
  .text{font-size:14px;color:#222;line-height:1.35}

  .viz{
    margin-top:12px;
    border:1px solid #e5e5e5;
    border-radius:12px;
    background:#fcfcfc;
    padding:12px;
  }
  .vizTitle{font-weight:1000;font-size:13px;margin-bottom:10px;color:#222}

  .block{
    border-radius:14px;
    border:2px solid rgba(0,0,0,.25);
    background: var(--bg);
    padding:12px;
    min-height:100px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition: outline .2s ease, transform .2s ease, filter .2s ease, opacity .2s ease;
  }
  .block.dim{opacity:.58}
  .block.hl{
    outline: 5px solid rgba(255,215,0,.95);
    outline-offset:-4px;
    transform: translateY(-1px);
    filter: brightness(1.02);
  }

  .blockTop{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    font-weight:1000;color:#111;
  }
  .name{font-size:14px}
  .parts{font-size:18px}
  .parts small{font-size:12px;font-weight:900;color:#333}

  .valueRow{
    margin-top:10px;
    font-weight:1000;
  }
  .pill{
    background: rgba(255,255,255,.75);
    border:1px solid rgba(0,0,0,.2);
    border-radius:999px;
    padding:4px 10px;
    font-weight:1000;
  }

  .sep{margin:10px 0;height:1px;background:#e9e9e9;}

  .calc{
    margin-top:10px;
    border:1px solid #e5e5e5;border-radius:12px;padding:12px;background:#fff;
  }
  .calcTitle{font-weight:1000;margin-bottom:8px}
  .line{margin:6px 0;font-weight:1000;}
  .eq{
    display:inline-block;
    font-weight:1000;
    font-size:18px;
    padding:8px 12px;
    border-radius:12px;
    background:#fafafa;
    border:1px solid #ddd;
  }
  .eq .hl{
    background: rgba(255,215,0,.25);
    padding:0 4px;border-radius:6px;
  }
  .hidden{display:none}

  .prompt{margin-top:12px;font-weight:1000}
  .inputRow{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type="text"]{
    padding:10px;border-radius:12px;border:1px solid #ccc;background:#fff;
    font-size:14px;min-width:140px;
  }
  .btn{
    padding:10px 12px;border:none;border-radius:12px;
    background:#007bff;color:#fff;cursor:pointer;font-size:13px;font-weight:900;
  }
  .btn:hover{background:#0062cc}
  .btn.secondary{background:#222}
  .btn.secondary:hover{background:#000}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .feedback{margin-top:10px;font-weight:1000;min-height:22px}
  .controls{margin-top:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

  :root{
    --A: rgba(235,235,235,.95);
    --B: rgba(255,230,120,.90);
  }
</style>
</head>
<body>
<div class="app">
  <h1>Verhältnisaufgaben – Vergleich nebeneinander</h1>

  <div class="top">
    <div class="score" id="score">Richtig: 0 / 0</div>
    <div class="meta" id="meta">0 / 0</div>
  </div>

  <div class="card">
    <div class="cat" id="cat"></div>
    <div class="title" id="title"></div>
    <div class="text" id="text"></div>

    <div class="viz" id="viz"></div>
    <div class="calc" id="calc"></div>

    <div class="prompt" id="prompt"></div>

    <div class="inputRow">
      <label for="ans" style="font-weight:1000;">Dein Ergebnis:</label>
      <input id="ans" type="text" inputmode="decimal" />
      <span id="unitTag" style="font-weight:1000;"></span>
      <button class="btn" id="checkBtn">Prüfen</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="btn secondary" id="restartBtn">Neu starten</button>
      <button class="btn" id="nextBtn" disabled>Weiter</button>
    </div>
  </div>
</div>

<script>
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function simplifyRatio(a,b){const g=gcd(a,b);return[a/g,b/g]}
function fmt(x){return (Math.round(x*1000)/1000).toString().replace(".",",")}
function parseDE(s){return Number(s.replace(",", "."))}
function compute(t){
  const [aa,bb]=simplifyRatio(t.rA,t.rB)
  const knownParts=t.knownSide==="A"?aa:bb
  const askParts=t.askSide==="A"?aa:bb
  const one=t.knownValue/knownParts
  return{aa,bb,one,result:one*askParts}
}

function renderViz(t){
  const c=compute(t)
  const max=Math.max(c.aa,c.bb)
  const widthA=(c.aa/max)*100
  const widthB=(c.bb/max)*100

  const showA=t.askSide==="A"?"?"+t.unit:(t.knownSide==="A"?fmt(t.knownValue)+t.unit:"?"+t.unit)
  const showB=t.askSide==="B"?"?"+t.unit:(t.knownSide==="B"?fmt(t.knownValue)+t.unit:"?"+t.unit)

  document.getElementById("viz").innerHTML=`
    <div class="vizTitle">Mehr Teile → breiterer Block</div>

    <div style="display:flex;align-items:flex-end;gap:20px;">
      <div class="block" style="--bg:var(--A);width:${widthA}%;">
        <div class="blockTop">
          <div>${t.nameA}</div>
          <div>${c.aa} <small>Teile</small></div>
        </div>
        <div class="valueRow"><span class="pill">${showA}</span></div>
      </div>

      <div class="block" style="--bg:var(--B);width:${widthB}%;">
        <div class="blockTop">
          <div>${t.nameB}</div>
          <div>${c.bb} <small>Teile</small></div>
        </div>
        <div class="valueRow"><span class="pill">${showB}</span></div>
      </div>
    </div>
  `
}

function renderCalc(t){
  const c=compute(t)
  document.getElementById("calc").innerHTML=`
    <div class="hidden" id="solution">
      <div>1 Teil: <span class="eq">${fmt(t.knownValue)} : ${t.knownSide==="A"?c.aa:c.bb} = ${fmt(c.one)}${t.unit}</span></div>
      <div style="margin-top:6px;">
        Ergebnis: <span class="eq">${fmt(c.result)}${t.unit}</span>
      </div>
    </div>
  `
}

const tasks=[
  {cat:"Erbschaft",title:"c)",text:"Hanni : Nanni = 3 : 2. Hanni bekommt 3000 €.",
   nameA:"Hanni",nameB:"Nanni",rA:3,rB:2,knownSide:"A",knownValue:3000,askSide:"B",unit:" €",
   colorA:"rgba(255,140,140,.85)",colorB:"rgba(140,190,255,.85)"}
]

let idx=0,graded=0,correct=0
const scoreEl=document.getElementById("score")
const metaEl=document.getElementById("meta")

function render(){
  const t=tasks[idx]
  document.documentElement.style.setProperty("--A",t.colorA)
  document.documentElement.style.setProperty("--B",t.colorB)

  document.getElementById("cat").textContent=t.cat
  document.getElementById("title").textContent=t.title
  document.getElementById("text").textContent=t.text
  document.getElementById("prompt").textContent="Wie viel bekommt "+(t.askSide==="A"?t.nameA:t.nameB)+"?"
  document.getElementById("unitTag").textContent=t.unit
  renderViz(t)
  renderCalc(t)
  scoreEl.textContent="Richtig: "+correct+" / "+graded
  metaEl.textContent=(idx+1)+" / "+tasks.length
}

document.getElementById("checkBtn").onclick=function(){
  const t=tasks[idx]
  const c=compute(t)
  const val=parseDE(document.getElementById("ans").value)
  graded++
  if(Math.abs(val-c.result)<0.001) correct++
  document.getElementById("solution").classList.remove("hidden")
  scoreEl.textContent="Richtig: "+correct+" / "+graded
  document.getElementById("nextBtn").disabled=false
}

document.getElementById("nextBtn").onclick=function(){
  idx=(idx+1)%tasks.length
  document.getElementById("ans").value=""
  document.getElementById("nextBtn").disabled=true
  render()
}

document.getElementById("restartBtn").onclick=function(){
  idx=0;graded=0;correct=0
  document.getElementById("ans").value=""
  document.getElementById("nextBtn").disabled=true
  render()
}

render()
</script>
</body>
</html>
