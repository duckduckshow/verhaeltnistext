<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verhältnisaufgaben – Zwei Blöcke untereinander (Teile → Wert)</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  body{margin:0;background:#f4f4f4;display:flex;justify-content:center}
  .app{
    background:#fff;max-width:980px;width:100%;
    margin:12px;padding:12px;border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  h1{margin:6px 0 12px;text-align:center;font-size:18px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .meta,.score{font-size:12px;color:#555;font-weight:900}

  .card{margin-top:10px;border:1px solid #e5e5e5;border-radius:12px;padding:12px;background:#fff}
  .cat{font-size:12px;font-weight:1000;color:#444;margin-bottom:6px}
  .title{font-weight:1000;font-size:16px;margin-bottom:8px}
  .text{font-size:14px;color:#222;line-height:1.35}

  .viz{
    margin-top:12px;
    border:1px solid #e5e5e5;
    border-radius:12px;
    background:#fcfcfc;
    padding:12px;
  }
  .vizTitle{font-weight:1000;font-size:13px;margin-bottom:10px;color:#222}

  /* ===== 2-Spalten-Layout (A | B) ===== */
  .grid2{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
  }

  .block{
    border-radius:14px;
    border:2px solid rgba(0,0,0,.25);
    background: var(--bg);
    padding:12px;
    min-height:92px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    transition: outline .2s ease, transform .2s ease, filter .2s ease, opacity .2s ease;
  }
  .block.dim{opacity:.58}
  .block.hl{
    outline: 5px solid rgba(255,215,0,.95);
    outline-offset:-4px;
    transform: translateY(-1px);
    filter: brightness(1.02);
  }

  .blockTop{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    font-weight:1000;color:#111;
  }
  .name{font-size:14px}
  .parts{font-size:18px}
  .parts small{font-size:12px;font-weight:900;color:#333}

  .valueRow{
    margin-top:6px;
    display:flex;justify-content:flex-start;gap:8px;align-items:center;flex-wrap:wrap;
    font-weight:1000;
  }
  .pill{
    background: rgba(255,255,255,.75);
    border:1px solid rgba(0,0,0,.2);
    border-radius:999px;
    padding:4px 10px;
    font-weight:1000;
  }

  .sep{
    margin:10px 0;
    height:1px;background:#e9e9e9;
  }

  .calc{
    margin-top:10px;
    border:1px solid #e5e5e5;border-radius:12px;padding:12px;background:#fff;
  }
  .calcTitle{font-weight:1000;margin-bottom:8px}
  .line{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    margin:6px 0;
    font-weight:1000;
  }
  .eq{
    display:inline-block;
    font-weight:1000;
    font-size:18px;
    padding:8px 12px;
    border-radius:12px;
    background:#fafafa;
    border:1px solid #ddd;
  }
  .eq .hl{
    background: rgba(255,215,0,.25);
    padding:0 4px;border-radius:6px;
  }
  .hidden{display:none}

  .prompt{margin-top:12px;font-weight:1000}
  .inputRow{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type="text"]{
    padding:10px;border-radius:12px;border:1px solid #ccc;background:#fff;
    font-size:14px;min-width:140px;
  }
  .btn{
    padding:10px 12px;border:none;border-radius:12px;
    background:#007bff;color:#fff;cursor:pointer;font-size:13px;font-weight:900;
  }
  .btn:hover{background:#0062cc}
  .btn.secondary{background:#222}
  .btn.secondary:hover{background:#000}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .switch{display:inline-flex;align-items:center;gap:8px;font-weight:900;user-select:none}
  .hint{font-size:12px;color:#555;font-weight:800;margin-top:6px}
  .feedback{margin-top:10px;font-weight:1000;min-height:22px}
  .controls{margin-top:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

  /* Farben per Aufgabe (CSS-Variablen) */
  :root{
    --A: rgba(235,235,235,.95); /* default */
    --B: rgba(255,230,120,.90);
  }
</style>
</head>
<body>
<div class="app">
  <h1>Verhältnisaufgaben – Teile oben, Wert darunter</h1>

  <div class="top">
    <div class="score" id="score">Richtig: 0 / 0</div>
    <div class="meta" id="meta">0 / 0</div>
  </div>

  <div class="card">
    <div class="cat" id="cat"></div>
    <div class="title" id="title"></div>
    <div class="text" id="text"></div>

    <div class="viz" id="viz"></div>

    <div class="calc" id="calc"></div>

    <div class="prompt" id="prompt"></div>

    <div class="inputRow">
      <label for="ans" style="font-weight:1000;">Dein Ergebnis:</label>
      <input id="ans" type="text" inputmode="decimal" placeholder="z.B. 1,5" />
      <span id="unitTag" style="font-weight:1000;"></span>
      <button class="btn" id="checkBtn">Prüfen</button>
      <label class="switch"><input type="checkbox" id="animToggle" checked /> Animation</label>
    </div>
    <div class="hint" id="hint"></div>
    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="btn secondary" id="restartBtn">Neu starten</button>
      <button class="btn" id="nextBtn" disabled>Weiter</button>
    </div>
  </div>
</div>

<script>
/* ===== Helpers ===== */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
function simplifyRatio(a,b){const g=gcd(a,b);return [a/g,b/g];}
function fmt(x){
  const r = Math.round((x + Number.EPSILON) * 1000) / 1000;
  const s = Number.isInteger(r) ? String(r) : String(r);
  return s.replace(".", ",");
}
function parseDE(s){
  if(typeof s!=="string") return NaN;
  const t=s.trim().replace(/\s+/g,"").replace(",",".");
  if(t==="") return NaN;
  const v=Number(t);
  return Number.isFinite(v)?v:NaN;
}
function nearlyEqual(a,b){return Math.abs(a-b) <= 1e-6;}

/* ===== Task compute ===== */
function compute(task){
  const [aa, bb] = simplifyRatio(task.rA, task.rB);
  const knownParts = (task.knownSide==="A") ? aa : bb;
  const askParts   = (task.askSide==="A") ? aa : bb;
  const onePart = task.knownValue / knownParts;
  const result = onePart * askParts;
  return {aa, bb, knownParts, askParts, onePart, result};
}

/* ===== Visual render ===== */
function applyColors(task){
  document.documentElement.style.setProperty("--A", task.colorA);
  document.documentElement.style.setProperty("--B", task.colorB);
}

function renderViz(task){
  const c = compute(task);

  const AisKnown = task.knownSide === "A";
  const AisAsk   = task.askSide === "A";

  const knownName = AisKnown ? task.nameA : task.nameB;
  const askName   = AisAsk ? task.nameA : task.nameB;

  const valA = AisKnown ? `${fmt(task.knownValue)}${task.unit}` : `?${task.unit}`;
  const valB = (!AisKnown) ? `${fmt(task.knownValue)}${task.unit}` : `?${task.unit}`;

  // Wenn gesuchte Seite A ist, dann steht ? unter A, sonst unter B.
  // (bekannte Seite kann A oder B sein)
  const unknownOnA = task.askSide === "A";
  const showA = unknownOnA ? `?${task.unit}` : (AisKnown ? `${fmt(task.knownValue)}${task.unit}` : `?${task.unit}`);
  const showB = (!unknownOnA) ? `?${task.unit}` : ((!AisKnown) ? `${fmt(task.knownValue)}${task.unit}` : `?${task.unit}`);

  const viz = document.getElementById("viz");
  viz.innerHTML = `
    <div class="vizTitle">So liest du es: <b>Teile</b> oben, <b>Wert</b> direkt darunter.</div>

    <div class="grid2">
      <div class="block" id="blockA" style="--bg: var(--A);">
        <div class="blockTop">
          <div class="name">${task.nameA}</div>
          <div class="parts">${c.aa} <small>Teile</small></div>
        </div>
        <div class="valueRow">
          <span class="pill" id="valA">${showA}</span>
        </div>
      </div>

      <div class="block" id="blockB" style="--bg: var(--B);">
        <div class="blockTop">
          <div class="name">${task.nameB}</div>
          <div class="parts">${c.bb} <small>Teile</small></div>
        </div>
        <div class="valueRow">
          <span class="pill" id="valB">${showB}</span>
        </div>
      </div>
    </div>

    <div class="sep"></div>

    <div class="hint">
      Tipp: <b>${knownName}</b> ist bekannt → rechne zuerst <b>1 Teil</b>. Dann rechne <b>${askName}</b>.
    </div>
  `;
}

/* ===== Calculation panel ===== */
function renderCalc(task){
  const c = compute(task);
  const calc = document.getElementById("calc");

  const knownName = (task.knownSide==="A") ? task.nameA : task.nameB;
  const askName   = (task.askSide==="A") ? task.nameA : task.nameB;

  calc.innerHTML = `
    <div class="calcTitle">Rechnung (erscheint nach dem Prüfen)</div>

    <div class="line hidden" id="line1">
      <div>1 Teil:</div>
      <div class="eq">
        <span class="hl">${fmt(task.knownValue)}</span> : <span class="hl">${c.knownParts}</span>
        = <span class="hl" id="onePart">${fmt(c.onePart)}</span>${task.unit}
      </div>
      <div class="hint">${knownName} hat ${c.knownParts} Teile.</div>
    </div>

    <div class="line hidden" id="line2">
      <div>${askName}:</div>
      <div class="eq">
        <span class="hl" id="onePart2">${fmt(c.onePart)}</span>${task.unit}
        · <span class="hl">${c.askParts}</span>
        = <span class="hl" id="result">${fmt(c.result)}</span>${task.unit}
      </div>
      <div class="hint">${askName} hat ${c.askParts} Teile.</div>
    </div>

    <div class="hint hidden" id="ratioLine">
      Verhältnis: <b>${task.nameA} : ${task.nameB} = ${c.aa} : ${c.bb}</b>
    </div>
  `;
}

function showCalc(animated){
  const l1=document.getElementById("line1");
  const l2=document.getElementById("line2");
  const rl=document.getElementById("ratioLine");
  l1.classList.remove("hidden");
  rl.classList.remove("hidden");
  if(!animated){
    l2.classList.remove("hidden");
    return;
  }
  setTimeout(()=>l2.classList.remove("hidden"), 900);
}

/* ===== Mini animation ===== */
let timers=[];
function stopAnim(){ timers.forEach(t=>clearTimeout(t)); timers=[]; clearHL(); }
function clearHL(){
  ["blockA","blockB"].forEach(id=>{
    const el=document.getElementById(id);
    if(el){ el.classList.remove("hl","dim"); }
  });
}
function focusKnown(task){
  const Aknown = task.knownSide==="A";
  const knownId = Aknown ? "blockA" : "blockB";
  const otherId = Aknown ? "blockB" : "blockA";
  const k=document.getElementById(knownId);
  const o=document.getElementById(otherId);
  if(k) k.classList.add("hl");
  if(o) o.classList.add("dim");
}
function focusAsk(task){
  const Aask = task.askSide==="A";
  const askId = Aask ? "blockA" : "blockB";
  const otherId = Aask ? "blockB" : "blockA";
  const a=document.getElementById(askId);
  const o=document.getElementById(otherId);
  if(a) a.classList.add("hl");
  if(o) o.classList.add("dim");
}
function animateSolve(task){
  stopAnim();
  focusKnown(task);
  timers.push(setTimeout(()=>{
    showCalc(true);
  }, 400));

  timers.push(setTimeout(()=>{
    // Jetzt ? durch Ergebnis ersetzen
    clearHL();
    focusAsk(task);
    const c=compute(task);
    const target = (task.askSide==="A") ? "valA" : "valB";
    const el=document.getElementById(target);
    if(el) el.textContent = `${fmt(c.result)}${task.unit}`;
  }, 1600));
}

/* ===== Tasks ===== */
const COLORS = {
  white: "rgba(235,235,235,.95)",
  yellow:"rgba(255,230,120,.92)",
  lightblue:"rgba(160,210,255,.92)",
  red:"rgba(255,140,140,.85)",
  blue:"rgba(140,190,255,.85)"
};

function makeTask({cat,title,context,nameA,nameB,rA,rB,knownSide,knownValue,askSide,unit,colorA,colorB,question}){
  return {cat,title,context,nameA,nameB,rA,rB,knownSide,knownValue,askSide,unit:unit||"",colorA,colorB,question};
}

const tasks = [
  makeTask({
    cat:"Farbe mischen",
    title:"Aufgabe a)",
    context:"Markus mischt weiße und gelbe Farbe im Verhältnis 5 : 2. Er hat 2 Liter gelbe Farbe.",
    nameA:"Weiße Farbe", nameB:"Gelbe Farbe",
    rA:5, rB:2,
    knownSide:"B", knownValue:2,
    askSide:"A",
    unit:" L",
    colorA: COLORS.white,
    colorB: COLORS.yellow,
    question:"Wie viel weiße Farbe braucht er?"
  }),
  makeTask({
    cat:"Farbe mischen",
    title:"Aufgabe b)",
    context:"Sandra mischt hellblaue und weiße Farbe im Verhältnis 3 : 1. Sie hat 0,5 Liter weiße Farbe.",
    nameA:"Hellblaue Farbe", nameB:"Weiße Farbe",
    rA:3, rB:1,
    knownSide:"B", knownValue:0.5,
    askSide:"A",
    unit:" L",
    colorA: COLORS.lightblue,
    colorB: COLORS.white,
    question:"Wie viel hellblaue Farbe braucht sie?"
  }),
  makeTask({
    cat:"Erbschaft",
    title:"Aufgabe c)",
    context:"Eine Erbschaft wird zwischen Hanni und Nanni im Verhältnis 3 : 2 aufgeteilt. Hanni bekommt 3000 €.",
    nameA:"Hanni", nameB:"Nanni",
    rA:3, rB:2,
    knownSide:"A", knownValue:3000,
    askSide:"B",
    unit:" €",
    colorA: COLORS.red,
    colorB: COLORS.blue,
    question:"Wie viel erbt Nanni?"
  }),
  makeTask({
    cat:"Erbschaft",
    title:"Aufgabe d)",
    context:"Eine Erbschaft wird zwischen Max und Moritz im Verhältnis 9 : 8 aufgeteilt. Moritz erhält 720 €.",
    nameA:"Max", nameB:"Moritz",
    rA:9, rB:8,
    knownSide:"B", knownValue:720,
    askSide:"A",
    unit:" €",
    colorA: COLORS.red,
    colorB: COLORS.blue,
    question:"Wie viel erbt Max?"
  })
];

/* ===== UI State ===== */
let idx=0, graded=0, correct=0, answered=false;

const scoreEl=document.getElementById("score");
const metaEl=document.getElementById("meta");
const catEl=document.getElementById("cat");
const titleEl=document.getElementById("title");
const textEl=document.getElementById("text");
const promptEl=document.getElementById("prompt");
const ansEl=document.getElementById("ans");
const unitTag=document.getElementById("unitTag");
const feedbackEl=document.getElementById("feedback");
const hintEl=document.getElementById("hint");
const checkBtn=document.getElementById("checkBtn");
const nextBtn=document.getElementById("nextBtn");
const restartBtn=document.getElementById("restartBtn");
const animToggle=document.getElementById("animToggle");

function updateTop(){
  scoreEl.textContent=`Richtig: ${correct} / ${graded}`;
  metaEl.textContent=`${idx+1} / ${tasks.length}`;
}

function render(){
  stopAnim();
  answered=false;
  nextBtn.disabled=true;
  feedbackEl.textContent="";
  ansEl.value="";

  const t=tasks[idx];
  applyColors(t);
  updateTop();

  catEl.textContent=t.cat;
  titleEl.textContent=t.title;
  textEl.textContent=t.context;

  promptEl.textContent=t.question;
  unitTag.textContent=t.unit;

  hintEl.textContent="Merksatz: Erst 1 Teil ausrechnen (teilen). Dann die gesuchte Seite (mal).";

  renderViz(t);
  renderCalc(t);

  // set unknown display fresh (in case previous task replaced ?)
  renderViz(t);

  setTimeout(()=>ansEl.focus(), 50);
}

function check(){
  if(answered) return;

  const t=tasks[idx];
  const c=compute(t);
  const user=parseDE(ansEl.value);

  if(!Number.isFinite(user)){
    feedbackEl.textContent="Bitte eine Zahl eingeben (z.B. 1,5).";
    return;
  }

  answered=true;
  graded++;
  const ok = nearlyEqual(user, c.result);
  if(ok) correct++;
  updateTop();

  // show calc + animate
  if(animToggle.checked){
    animateSolve(t);
  }else{
    showCalc(false);
    // replace ? immediately
    const target = (t.askSide==="A") ? "valA" : "valB";
    const el=document.getElementById(target);
    if(el) el.textContent = `${fmt(c.result)}${t.unit}`;
    // focus ask
    clearHL();
    focusAsk(t);
  }

  const askName=(t.askSide==="A")?t.nameA:t.nameB;
  const right = `${fmt(c.result)}${t.unit}`;

  feedbackEl.textContent = ok
    ? `Richtig. ${askName}: ${right}`
    : `Falsch. Richtig wäre: ${askName}: ${right}`;

  nextBtn.disabled=false;
}

checkBtn.addEventListener("click", check);
ansEl.addEventListener("keydown", (e)=>{ if(e.key==="Enter") check(); });

nextBtn.addEventListener("click", ()=>{
  idx=(idx+1) % tasks.length;
  render();
});

restartBtn.addEventListener("click", ()=>{
  idx=0; graded=0; correct=0;
  render();
});

render();
</script>
</body>
</html>
