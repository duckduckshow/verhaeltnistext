<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verhältnisaufgaben – Zwei Balken (Teile + Menge) mit Animation</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  body{margin:0;background:#f4f4f4;display:flex;justify-content:center}
  .app{
    background:#fff;max-width:1180px;width:100%;
    margin:12px;padding:12px;border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  h1{margin:6px 0 12px;text-align:center;font-size:18px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .meta,.score{font-size:12px;color:#555;font-weight:900}
  .card{margin-top:10px;border:1px solid #e5e5e5;border-radius:12px;padding:12px;background:#fff}
  .cat{font-size:12px;font-weight:1000;color:#444;margin-bottom:6px}
  .title{font-weight:1000;font-size:16px;margin-bottom:8px}
  .text{font-size:14px;color:#222;line-height:1.35}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-top:12px}
  .col{flex:1 1 560px}
  .stepsPanel{flex:1 1 520px;border:1px solid #e5e5e5;border-radius:12px;background:#fff;padding:12px}
  .stepsTitle{font-weight:1000;font-size:14px;margin-bottom:10px}
  .stepsGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:stretch}
  .stepBox{border:1px solid #eee;background:#fafafa;border-radius:12px;padding:10px;min-height:112px}
  .stepNr{font-weight:1000;font-size:13px;margin-bottom:6px}
  .stepText{font-weight:1000;font-size:14px;margin-bottom:6px}
  .eq{
    display:inline-block;font-weight:1000;font-size:18px;
    padding:8px 12px;border-radius:12px;background:#fff;border:1px solid #ddd;
    white-space:nowrap;
  }
  .eq .hl{background:rgba(255,215,0,.25);padding:0 4px;border-radius:6px}
  .stepHidden{opacity:0;transform:translateY(6px);pointer-events:none}
  .stepShown{opacity:1;transform:translateY(0);pointer-events:auto;transition:opacity .35s ease, transform .35s ease}
  .step3A{background:rgba(255,120,120,.14)!important;border-color:rgba(255,120,120,.35)!important}
  .step3B{background:rgba(120,170,255,.14)!important;border-color:rgba(120,170,255,.35)!important}
  .eqA{border-color:rgba(255,120,120,.55)!important}
  .eqB{border-color:rgba(120,170,255,.55)!important}

  .prompt{margin-top:10px;font-weight:1000;font-size:14px}
  .inputRow{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type="text"]{
    padding:10px;border-radius:12px;border:1px solid #ccc;background:#fff;
    font-size:14px;min-width:140px;
  }
  .btn{
    padding:10px 12px;border:none;border-radius:12px;
    background:#007bff;color:#fff;cursor:pointer;font-size:13px;font-weight:900;
  }
  .btn:hover{background:#0062cc}
  .btn.secondary{background:#222}
  .btn.secondary:hover{background:#000}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .feedback{margin-top:10px;font-weight:1000;min-height:22px}
  .hint{font-size:12px;color:#555;font-weight:800;margin-top:6px}
  .controls{margin-top:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

  :root{
    --A: rgba(255, 120, 120, .78);
    --B: rgba(120, 170, 255, .78);
    --outline:#333;
    --glow: rgba(255, 215, 0, .95);
  }

  .vizCard{border:1px solid #e5e5e5;border-radius:12px;padding:12px;background:#fcfcfc}
  .vizTitle{font-weight:1000;margin-bottom:10px;font-size:13px;color:#222}
  .vizBlock{margin-top:10px}
  .barWrap{position:relative}
  .bar{
    width:100%;height:72px;border:2px solid var(--outline);
    border-radius:14px;overflow:hidden;display:flex;background:#fff;
  }
  .part{
    height:100%;border-right:1px solid rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;
    font-weight:1000;font-size:18px;color:#111;user-select:none;
    position:relative;transition:outline .18s ease, transform .18s ease, filter .18s ease;
  }
  .part:last-child{border-right:none}
  .partA{background:var(--A)}
  .partB{background:var(--B)}
  .part .num{
    padding:3px 12px;border-radius:999px;
    background:rgba(255,255,255,.85);
    border:1px solid rgba(0,0,0,.25);
    min-width:40px;text-align:center;font-size:16px
  }
  .part.dim .num{opacity:.45}
  .part.highlight{
    outline:5px solid var(--glow);outline-offset:-5px;
    transform:translateY(-1px) scale(1.01);filter:brightness(1.03);z-index:1;
  }
  .part.groupHighlight{
    outline:5px solid var(--glow);outline-offset:-5px;filter:brightness(1.03);
  }

  .legend{margin-top:10px;font-size:12px;color:#444;line-height:1.25}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 12px;border-radius:999px;border:1px solid #ddd;
    background:#fff;font-weight:1000;margin-right:10px;margin-bottom:6px;
  }
  .dot{width:10px;height:10px;border-radius:999px;display:inline-block;border:1px solid rgba(0,0,0,.25)}
  .dotA{background:var(--A)} .dotB{background:var(--B)}

  /* Klammern über Teilgruppen (bekannt/gesucht) */
  .bracket{
    position:absolute;top:-28px;height:24px;
    border-top:3px solid #111;
    border-left:3px solid #111;
    border-right:3px solid #111;
    border-radius:10px 10px 0 0;
    display:flex;align-items:flex-start;justify-content:center;
    padding-top:2px;
    pointer-events:none;
    opacity:0;
    transform:translateY(4px);
    transition:opacity .25s ease, transform .25s ease, filter .25s ease;
  }
  .bracket.show{opacity:1;transform:translateY(0)}
  .bracket.glow{filter:drop-shadow(0 0 6px rgba(255,215,0,.85))}
  .brLabel{
    font-weight:1000;font-size:12px;background:rgba(255,255,255,.9);
    border:1px solid rgba(0,0,0,.2);padding:2px 8px;border-radius:999px;
  }

  .subTitle{font-weight:1000;font-size:12px;color:#333;margin:10px 0 6px}
  .tiny{font-size:12px;color:#666;font-weight:800}
  .switch{
    display:inline-flex;align-items:center;gap:8px;font-weight:900;
    user-select:none
  }

  @media (max-width:980px){
    .stepsGrid{grid-template-columns:1fr 1fr}
    .stepBox:nth-child(3){grid-column:1/-1}
    .eq{white-space:normal}
  }
</style>
</head>
<body>
<div class="app">
  <h1>Verhältnisaufgaben – zwei Balken (Teile + Menge)</h1>

  <div class="top">
    <div class="score" id="score">Richtig: 0 / 0</div>
    <div class="meta" id="meta">0 / 0</div>
  </div>

  <div class="card">
    <div class="cat" id="cat"></div>
    <div class="title" id="title"></div>
    <div class="text" id="text"></div>

    <div class="row">
      <div class="col">
        <div class="vizCard" id="viz"></div>
      </div>
      <div class="stepsPanel" id="steps"></div>
    </div>

    <div class="prompt" id="prompt"></div>

    <div class="inputRow">
      <label for="ans" style="font-weight:1000;">Dein Ergebnis:</label>
      <input id="ans" type="text" inputmode="decimal" placeholder="z.B. 1,5" />
      <span id="unitTag" style="font-weight:1000;"></span>
      <button class="btn" id="checkBtn">Prüfen</button>
      <label class="switch"><input type="checkbox" id="animToggle" checked /> Animation</label>
    </div>
    <div class="hint" id="hint"></div>
    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="btn secondary" id="restartBtn">Neu starten</button>
      <button class="btn" id="nextBtn" disabled>Weiter</button>
    </div>
  </div>
</div>

<script>
/* ========= Basics ========= */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
function simplifyRatio(a,b){const g=gcd(a,b);return [a/g,b/g];}
function fmt(x){
  const r = Math.round((x + Number.EPSILON) * 1000) / 1000;
  const s = Number.isInteger(r) ? String(r) : String(r);
  return s.replace(".", ",");
}
function parseDE(s){
  if(typeof s!=="string") return NaN;
  const t=s.trim().replace(/\s+/g,"").replace(",",".");
  if(t==="") return NaN;
  const v=Number(t);
  return Number.isFinite(v)?v:NaN;
}
function nearlyEqual(a,b){return Math.abs(a-b) <= 1e-6;}

/* ========= Animation timers ========= */
let timers=[];
function stopAnimation(){
  timers.forEach(t=>clearTimeout(t));
  timers=[];
  clearPartMarks();
  clearBracketGlow();
}
function clearPartMarks(){
  const bars=[document.getElementById("ratioBar"), document.getElementById("qtyBar")];
  bars.forEach(bar=>{
    if(!bar) return;
    [...bar.querySelectorAll(".part")].forEach(p=>p.classList.remove("highlight","groupHighlight","dim"));
  });
}
function clearBracketGlow(){
  ["brKnown","brAsk"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.classList.remove("glow");
  });
}

/* ========= Core compute (bekannte Seite -> pro Teil -> gesuchte Seite) ========= */
function compute(task){
  const [aa, bb] = simplifyRatio(task.rA, task.rB);
  const knownParts = (task.knownSide==="A") ? aa : bb;
  const askParts   = (task.askSide==="A") ? aa : bb;
  const onePart = task.knownValue / knownParts;
  const result = onePart * askParts;
  return {aa,bb,sum:aa+bb,knownParts,askParts,onePart,result};
}

/* ========= Visual: TWO bars =========
   1) ratioBar: zeigt nur Teile (A/B)
   2) qtyBar: gleiche Teile, aber Zahlen/klammern für bekannt & gesucht
*/
function renderTwoBars(vizEl, task){
  const c=compute(task);
  const sum=c.sum;

  const parts=[];
  for(let i=0;i<sum;i++){
    parts.push({cls: i < c.aa ? "partA" : "partB"});
  }

  // Labels
  const askName = (task.askSide==="A") ? task.nameA : task.nameB;
  const knownName = (task.knownSide==="A") ? task.nameA : task.nameB;

  vizEl.innerHTML = `
    <div class="vizTitle">Zwei Balken: oben „Teile“, unten „Menge“</div>

    <div class="vizBlock">
      <div class="subTitle">1) Teile-Balken (nur Verhältnis <b>${c.aa}:${c.bb}</b>)</div>
      <div class="barWrap">
        <div class="bar" id="ratioBar">
          ${parts.map((p,idx)=>`
            <div class="part ${p.cls}" data-idx="${idx}" style="width:${(100/sum).toFixed(3)}%">
              <div class="num">${idx < c.aa ? "1" : "1"}</div>
            </div>
          `).join("")}
        </div>
      </div>
      <div class="legend">
        <span class="pill"><span class="dot dotA"></span>${task.nameA}: ${c.aa} Teile</span>
        <span class="pill"><span class="dot dotB"></span>${task.nameB}: ${c.bb} Teile</span>
        <span class="tiny">Insgesamt: ${sum} gleich große Teile</span>
      </div>
    </div>

    <div class="vizBlock">
      <div class="subTitle">2) Mengen-Balken (bekannt → „pro Teil“ → gesucht)</div>
      <div class="barWrap" id="qtyWrap">
        <div class="bracket" id="brKnown"><div class="brLabel" id="brKnownLabel"></div></div>
        <div class="bracket" id="brAsk"><div class="brLabel" id="brAskLabel"></div></div>

        <div class="bar" id="qtyBar">
          ${parts.map((p,idx)=>`
            <div class="part ${p.cls}" data-idx="${idx}" style="width:${(100/sum).toFixed(3)}%">
              <div class="num"></div>
            </div>
          `).join("")}
        </div>
      </div>

      <div class="tiny" style="margin-top:8px;">
        Bekannt: <b>${knownName}</b> &nbsp;|&nbsp; Gesucht: <b>${askName}</b>
      </div>
    </div>
  `;

  // Init qty numbers empty + brackets positioned
  setAllQtyNumbers("");
  placeBrackets(task);

  // Show brackets (known shows value, ask shows x/?)
  const brKnownLabel=document.getElementById("brKnownLabel");
  const brAskLabel=document.getElementById("brAskLabel");
  brKnownLabel.textContent = `${fmt(task.knownValue)}${task.unit}`;
  brAskLabel.textContent = `x${task.unit}`;

  document.getElementById("brKnown").classList.add("show");
  document.getElementById("brAsk").classList.add("show");
}

/* Place bracket elements over correct ranges in qtyBar */
function placeBrackets(task){
  const c=compute(task);
  const wrap=document.getElementById("qtyWrap");
  const bar=document.getElementById("qtyBar");
  if(!wrap || !bar) return;

  const parts=[...bar.querySelectorAll(".part")];
  if(parts.length===0) return;

  function rangeRect(fromIdx,toIdxInclusive){
    const a=parts[fromIdx].getBoundingClientRect();
    const b=parts[toIdxInclusive].getBoundingClientRect();
    const w=wrap.getBoundingClientRect();
    return {
      left: a.left - w.left,
      right: b.right - w.left
    };
  }

  const knownIsA = task.knownSide==="A";
  const askIsA = task.askSide==="A";

  const knownFrom = knownIsA ? 0 : c.aa;
  const knownTo   = knownIsA ? (c.aa-1) : (c.aa + c.bb - 1);

  const askFrom   = askIsA ? 0 : c.aa;
  const askTo     = askIsA ? (c.aa-1) : (c.aa + c.bb - 1);

  const rK=rangeRect(knownFrom, knownTo);
  const rA=rangeRect(askFrom, askTo);

  const brKnown=document.getElementById("brKnown");
  const brAsk=document.getElementById("brAsk");

  const pad=2; // small inset
  brKnown.style.left = (rK.left + pad) + "px";
  brKnown.style.width = Math.max(8, (rK.right - rK.left - 2*pad)) + "px";

  brAsk.style.left = (rA.left + pad) + "px";
  brAsk.style.width = Math.max(8, (rA.right - rA.left - 2*pad)) + "px";
}

window.addEventListener("resize", ()=>{ const t=tasks[idx]; if(t) placeBrackets(t); });

/* Qty bar numbers helpers */
function setAllQtyNumbers(val){
  const bar=document.getElementById("qtyBar");
  if(!bar) return;
  [...bar.querySelectorAll(".part .num")].forEach(n=>n.textContent=val);
}
function setQtyNumber(i,val){
  const bar=document.getElementById("qtyBar");
  if(!bar) return;
  const box=bar.querySelector(`.part[data-idx="${i}"] .num`);
  if(box) box.textContent=val;
}
function markQtyPart(i, cls){
  const bar=document.getElementById("qtyBar");
  if(!bar) return;
  const p=bar.querySelector(`.part[data-idx="${i}"]`);
  if(p) p.classList.add(cls);
}
function unmarkQtyPart(i, cls){
  const bar=document.getElementById("qtyBar");
  if(!bar) return;
  const p=bar.querySelector(`.part[data-idx="${i}"]`);
  if(p) p.classList.remove(cls);
}
function highlightQtyGroup(indices){
  const bar=document.getElementById("qtyBar");
  if(!bar) return;
  indices.forEach(i=>{
    const p=bar.querySelector(`.part[data-idx="${i}"]`);
    if(p) p.classList.add("groupHighlight");
  });
}
function dimNonGroup(indices){
  const bar=document.getElementById("qtyBar");
  if(!bar) return;
  const set=new Set(indices);
  [...bar.querySelectorAll(".part")].forEach(p=>{
    const i=Number(p.getAttribute("data-idx"));
    if(!set.has(i)) p.classList.add("dim");
  });
}

/* ========= Steps panel ========= */
function renderSteps(stepsEl, task){
  const c=compute(task);
  const askName=(task.askSide==="A")?task.nameA:task.nameB;
  const knownName=(task.knownSide==="A")?task.nameA:task.nameB;

  const step3Class=(task.askSide==="A")?"step3A":"step3B";
  const eq3Class=(task.askSide==="A")?"eqA":"eqB";

  stepsEl.innerHTML=`
    <div class="stepsTitle">Rechnung (erscheint nach dem Prüfen)</div>
    <div class="stepsGrid">
      <div class="stepBox stepHidden" id="step1Box">
        <div class="stepNr">Schritt 1</div>
        <div class="stepText">Teile ablesen</div>
        <div class="eq"><span class="hl">${c.aa}</span> + <span class="hl">${c.bb}</span> = <span class="hl">${c.sum}</span></div>
      </div>

      <div class="stepBox stepHidden" id="step2Box">
        <div class="stepNr">Schritt 2</div>
        <div class="stepText">Wert pro Teil</div>
        <div class="eq"><span class="hl">${fmt(task.knownValue)}</span> : <span class="hl">${c.knownParts}</span> = <span class="hl">${fmt(c.onePart)}</span>${task.unit}</div>
        <div class="tiny">${knownName} hat ${c.knownParts} Teile.</div>
      </div>

      <div class="stepBox stepHidden ${step3Class}" id="step3Box">
        <div class="stepNr">Schritt 3</div>
        <div class="stepText">${askName} berechnen</div>
        <div class="eq ${eq3Class}"><span class="hl">${fmt(c.onePart)}</span> · <span class="hl">${c.askParts}</span> = <span class="hl">${fmt(c.result)}</span>${task.unit}</div>
        <div class="tiny">${askName} hat ${c.askParts} Teile.</div>
      </div>
    </div>

    <div class="tiny" style="margin-top:10px;">
      Verhältnisgleichung: <b>${knownName}</b> / ${c.knownParts} = <b>x</b> / ${c.askParts}
    </div>
  `;
}
function showStepBox(id){
  const el=document.getElementById(id);
  if(!el) return;
  el.classList.remove("stepHidden");
  el.classList.add("stepShown");
}

/* ========= Post-check animation ========= */
function animateAfterCheck(task){
  stopAnimation();
  const c=compute(task);

  const step1Delay=450;
  const step2Delay=2300;
  const fillDelay =4300;

  timers.push(setTimeout(()=>showStepBox("step1Box"), step1Delay));

  timers.push(setTimeout(()=>{
    showStepBox("step2Box");
    // glow known bracket (we "use" it)
    const brK=document.getElementById("brKnown");
    if(brK){ brK.classList.add("glow"); }
  }, step2Delay));

  timers.push(setTimeout(()=>fillPartsThenSolveX(task), fillDelay));
}

function fillPartsThenSolveX(task){
  stopAnimation();
  const c=compute(task);

  // show known & ask brackets
  const brK=document.getElementById("brKnown");
  const brA=document.getElementById("brAsk");
  if(brK) brK.classList.add("show");
  if(brA) brA.classList.add("show");

  // Start: qty numbers empty
  setAllQtyNumbers("");
  clearPartMarks();

  const one=fmt(c.onePart);
  const sum=c.sum;

  const startDelay=350;
  const perPartDelay=520;
  const highlightHold=330;

  // Fill each part with "onePart"
  for(let i=0;i<sum;i++){
    timers.push(setTimeout(()=>{
      clearPartMarks();
      markQtyPart(i,"highlight");
      setQtyNumber(i, one);
    }, startDelay + i*perPartDelay));

    timers.push(setTimeout(()=>{
      unmarkQtyPart(i,"highlight");
    }, startDelay + i*perPartDelay + highlightHold));
  }

  const afterFill = startDelay + sum*perPartDelay + 650;

  timers.push(setTimeout(()=>{
    // Now focus on asked group => show step3 + compute x
    showStepBox("step3Box");

    const idxs=[];
    if(task.askSide==="A"){
      for(let i=0;i<c.aa;i++) idxs.push(i);
    }else{
      for(let i=c.aa;i<c.aa+c.bb;i++) idxs.push(i);
    }

    clearPartMarks();
    highlightQtyGroup(idxs);
    dimNonGroup(idxs);

    // glow ask bracket and replace x with result
    if(brA) brA.classList.add("glow");
    const brAskLabel=document.getElementById("brAskLabel");
    if(brAskLabel) brAskLabel.textContent = `${fmt(c.result)}${task.unit}`;
  }, afterFill));
}

/* ========= Tasks ========= */
function makeTask({cat,title,context,nameA,nameB,rA,rB,knownSide,knownValue,askSide,unit}){
  return {cat,title,context,nameA,nameB,rA,rB,knownSide,knownValue,askSide,unit:unit||""};
}

const tasks = [
  makeTask({
    cat:"Farbe mischen",
    title:"Aufgabe a)",
    context:"Markus mischt weiße und gelbe Farbe im Verhältnis 5 : 2. Er hat 2 Liter gelbe Farbe. Wie viel weiße Farbe braucht er?",
    nameA:"Weiße Farbe", nameB:"Gelbe Farbe",
    rA:5, rB:2,
    knownSide:"B", knownValue:2,
    askSide:"A",
    unit:" L"
  }),
  makeTask({
    cat:"Farbe mischen",
    title:"Aufgabe b)",
    context:"Sandra mischt hellblaue und weiße Farbe im Verhältnis 3 : 1. Sie hat 0,5 Liter weiße Farbe. Wie viel hellblaue Farbe braucht sie?",
    nameA:"Hellblaue Farbe", nameB:"Weiße Farbe",
    rA:3, rB:1,
    knownSide:"B", knownValue:0.5,
    askSide:"A",
    unit:" L"
  }),
  makeTask({
    cat:"Erbschaft",
    title:"Aufgabe c)",
    context:"Eine Erbschaft wird zwischen Hanni und Nanni im Verhältnis 3 : 2 aufgeteilt. Hanni bekommt 3000 €. Wie viel erbt Nanni?",
    nameA:"Hanni", nameB:"Nanni",
    rA:3, rB:2,
    knownSide:"A", knownValue:3000,
    askSide:"B",
    unit:" €"
  }),
  makeTask({
    cat:"Erbschaft",
    title:"Aufgabe d)",
    context:"Eine Erbschaft wird zwischen Max und Moritz im Verhältnis 9 : 8 aufgeteilt. Moritz erhält 720 €. Wie viel erbt Max?",
    nameA:"Max", nameB:"Moritz",
    rA:9, rB:8,
    knownSide:"B", knownValue:720,
    askSide:"A",
    unit:" €"
  })
];

/* ========= UI State ========= */
let idx=0;
let graded=0;
let correct=0;
let answered=false;

const scoreEl=document.getElementById("score");
const metaEl=document.getElementById("meta");
const catEl=document.getElementById("cat");
const titleEl=document.getElementById("title");
const textEl=document.getElementById("text");
const vizEl=document.getElementById("viz");
const stepsEl=document.getElementById("steps");
const promptEl=document.getElementById("prompt");
const hintEl=document.getElementById("hint");
const ansEl=document.getElementById("ans");
const unitTag=document.getElementById("unitTag");
const feedbackEl=document.getElementById("feedback");
const checkBtn=document.getElementById("checkBtn");
const nextBtn=document.getElementById("nextBtn");
const restartBtn=document.getElementById("restartBtn");
const animToggle=document.getElementById("animToggle");

function updateTop(){
  scoreEl.textContent=`Richtig: ${correct} / ${graded}`;
  metaEl.textContent=`${idx+1} / ${tasks.length}`;
}

function render(){
  stopAnimation();
  answered=false;
  nextBtn.disabled=true;
  feedbackEl.textContent="";
  ansEl.value="";

  const t=tasks[idx];
  updateTop();

  catEl.textContent=t.cat;
  titleEl.textContent=t.title;
  textEl.textContent=t.context;

  const askName=(t.askSide==="A")?t.nameA:t.nameB;
  promptEl.textContent=`Wie viel ist ${askName}?`;

  unitTag.textContent=t.unit;
  hintEl.textContent="Tipp: Oben siehst du nur die Teile. Unten siehst du die echten Mengen. Erst „pro Teil“, dann die gesuchte Klammer.";

  renderTwoBars(vizEl, t);
  renderSteps(stepsEl, t);

  // focus
  setTimeout(()=>ansEl.focus(), 50);
}

function lockAndRevealSteps(t){
  if(animToggle.checked){
    animateAfterCheck(t);
  }else{
    showStepBox("step1Box");
    showStepBox("step2Box");
    showStepBox("step3Box");

    // ohne Animation: fülle sofort + löse x
    const c=compute(t);
    const one=fmt(c.onePart);
    setAllQtyNumbers(one);

    const askIdxs=[];
    if(t.askSide==="A"){ for(let i=0;i<c.aa;i++) askIdxs.push(i); }
    else{ for(let i=c.aa;i<c.aa+c.bb;i++) askIdxs.push(i); }
    highlightQtyGroup(askIdxs);
    dimNonGroup(askIdxs);

    const brAskLabel=document.getElementById("brAskLabel");
    if(brAskLabel) brAskLabel.textContent=`${fmt(c.result)}${t.unit}`;
  }
}

function check(){
  if(answered) return;

  const t=tasks[idx];
  const c=compute(t);
  const user=parseDE(ansEl.value);

  if(!Number.isFinite(user)){
    feedbackEl.textContent="Bitte eine Zahl eingeben (z.B. 1,5).";
    return;
  }

  answered=true;
  graded++;

  const ok=nearlyEqual(user, c.result);
  if(ok) correct++;

  updateTop();
  lockAndRevealSteps(t);

  const askName=(t.askSide==="A")?t.nameA:t.nameB;
  const right=fmt(c.result)+t.unit;

  feedbackEl.textContent = ok
    ? `Richtig. ${askName}: ${right}`
    : `Falsch. Richtig wäre: ${askName}: ${right}`;

  nextBtn.disabled=false;
}

checkBtn.addEventListener("click", check);
ansEl.addEventListener("keydown", (e)=>{ if(e.key==="Enter") check(); });

nextBtn.addEventListener("click", ()=>{
  idx=(idx+1) % tasks.length;
  render();
});

restartBtn.addEventListener("click", ()=>{
  idx=0; graded=0; correct=0;
  render();
});

render();
</script>
</body>
</html>
