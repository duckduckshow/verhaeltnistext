<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verhältnisaufgaben – Zwei Balken (3 feste Größen), ohne Klammern</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  body{margin:0;background:#f4f4f4;display:flex;justify-content:center}
  .app{
    background:#fff;max-width:1180px;width:100%;
    margin:12px;padding:12px;border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  h1{margin:6px 0 12px;text-align:center;font-size:18px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .meta,.score{font-size:12px;color:#555;font-weight:900}
  .card{margin-top:10px;border:1px solid #e5e5e5;border-radius:12px;padding:12px;background:#fff}
  .cat{font-size:12px;font-weight:1000;color:#444;margin-bottom:6px}
  .title{font-weight:1000;font-size:16px;margin-bottom:8px}
  .text{font-size:14px;color:#222;line-height:1.35}

  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-top:12px}
  .col{flex:1 1 560px}
  .stepsPanel{flex:1 1 520px;border:1px solid #e5e5e5;border-radius:12px;background:#fff;padding:12px}

  .stepsTitle{font-weight:1000;font-size:14px;margin-bottom:10px}
  .stepsGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
  .stepBox{border:1px solid #eee;background:#fafafa;border-radius:12px;padding:10px;min-height:112px}
  .stepNr{font-weight:1000;font-size:13px;margin-bottom:6px}
  .stepText{font-weight:1000;font-size:14px;margin-bottom:6px}
  .eq{
    display:inline-block;font-weight:1000;font-size:18px;
    padding:8px 12px;border-radius:12px;background:#fff;border:1px solid #ddd;
    white-space:nowrap;
  }
  .eq .hl{background:rgba(255,215,0,.25);padding:0 4px;border-radius:6px}
  .stepHidden{opacity:0;transform:translateY(6px);pointer-events:none}
  .stepShown{opacity:1;transform:translateY(0);pointer-events:auto;transition:opacity .35s ease, transform .35s ease}
  .stepAskA{background:rgba(120,170,255,.12)!important;border-color:rgba(120,170,255,.35)!important}
  .stepAskB{background:rgba(255,120,120,.12)!important;border-color:rgba(255,120,120,.35)!important}

  .prompt{margin-top:10px;font-weight:1000;font-size:14px}
  .inputRow{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type="text"]{
    padding:10px;border-radius:12px;border:1px solid #ccc;background:#fff;
    font-size:14px;min-width:140px;
  }
  .btn{
    padding:10px 12px;border:none;border-radius:12px;
    background:#007bff;color:#fff;cursor:pointer;font-size:13px;font-weight:900;
  }
  .btn:hover{background:#0062cc}
  .btn.secondary{background:#222}
  .btn.secondary:hover{background:#000}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .feedback{margin-top:10px;font-weight:1000;min-height:22px}
  .hint{font-size:12px;color:#555;font-weight:800;margin-top:6px}
  .controls{margin-top:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .switch{display:inline-flex;align-items:center;gap:8px;font-weight:900;user-select:none}

  :root{
    --A: rgba(255, 120, 120, .78);
    --B: rgba(120, 170, 255, .78);
    --outline:#333;
    --glow: rgba(255, 215, 0, .95);
  }

  .vizCard{border:1px solid #e5e5e5;border-radius:12px;padding:12px;background:#fcfcfc}
  .vizTitle{font-weight:1000;margin-bottom:10px;font-size:13px;color:#222}
  .vizBlock{margin-top:10px}
  .subTitle{font-weight:1000;font-size:12px;color:#333;margin:10px 0 6px}
  .tiny{font-size:12px;color:#666;font-weight:800}

  /* ===== Balken: Rahmen + Innenbreite, damit nichts überläuft ===== */
  .barFrame{
    width:100%;
    display:flex;
    justify-content:center;
  }
  .barInner{
    width:100%;
    max-width: 980px;   /* <- hier wird’s stabil */
  }

  .bar{
    width:100%;
    height:72px;
    border:2px solid var(--outline);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    background:#fff;
  }
  .part{
    height:100%;
    border-right:1px solid rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;
    font-weight:1000;font-size:18px;color:#111;
    position:relative;
    transition:outline .18s ease, transform .18s ease, filter .18s ease, opacity .18s ease;
    user-select:none;
  }
  .part:last-child{border-right:none}
  .partA{background:var(--A)}
  .partB{background:var(--B)}
  .part .num{
    padding:3px 12px;border-radius:999px;
    background:rgba(255,255,255,.85);
    border:1px solid rgba(0,0,0,.25);
    min-width:40px;text-align:center;font-size:16px
  }
  .part.dim{opacity:.55}
  .part.highlight{
    outline:5px solid var(--glow);outline-offset:-5px;
    transform:translateY(-1px) scale(1.01);filter:brightness(1.03);z-index:1;
  }
  .part.groupHighlight{
    outline:5px solid var(--glow);outline-offset:-5px;filter:brightness(1.03);
  }

  .legend{margin-top:10px;font-size:12px;color:#444;line-height:1.25}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 12px;border-radius:999px;border:1px solid #ddd;
    background:#fff;font-weight:1000;margin-right:10px;margin-bottom:6px;
  }
  .dot{width:10px;height:10px;border-radius:999px;display:inline-block;border:1px solid rgba(0,0,0,.25)}
  .dotA{background:var(--A)} .dotB{background:var(--B)}

  /* ===== 2. Balken: 3 feste Größen (IM Inneren), groß = 100% ===== */
  .qtyInnerSmall{ width: 86%; }
  .qtyInnerNormal{ width: 93%; }
  .qtyInnerLarge{ width: 100%; }

  @media (max-width:980px){
    .eq{white-space:normal}
  }
</style>
</head>

<body>
<div class="app">
  <h1>Verhältnisaufgaben – zwei Balken (stabil), Verhältnisgleichung als Verhältnis</h1>

  <div class="top">
    <div class="score" id="score">Richtig: 0 / 0</div>
    <div class="meta" id="meta">0 / 0</div>
  </div>

  <div class="card">
    <div class="cat" id="cat"></div>
    <div class="title" id="title"></div>
    <div class="text" id="text"></div>

    <div class="row">
      <div class="col">
        <div class="vizCard" id="viz"></div>
      </div>
      <div class="stepsPanel" id="steps"></div>
    </div>

    <div class="prompt" id="prompt"></div>

    <div class="inputRow">
      <label for="ans" style="font-weight:1000;">Dein Ergebnis:</label>
      <input id="ans" type="text" inputmode="decimal" placeholder="z.B. 1,5" />
      <span id="unitTag" style="font-weight:1000;"></span>
      <button class="btn" id="checkBtn">Prüfen</button>
      <label class="switch"><input type="checkbox" id="animToggle" checked /> Animation</label>
    </div>

    <div class="hint" id="hint"></div>
    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="btn secondary" id="restartBtn">Neu starten</button>
      <button class="btn" id="nextBtn" disabled>Weiter</button>
    </div>
  </div>
</div>

<script>
/* ========= Helpers ========= */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
function simplifyRatio(a,b){const g=gcd(a,b);return [a/g,b/g];}
function fmt(x){
  const r = Math.round((x + Number.EPSILON) * 1000) / 1000;
  const s = Number.isInteger(r) ? String(r) : String(r);
  return s.replace(".", ",");
}
function parseDE(s){
  if(typeof s!=="string") return NaN;
  const t=s.trim().replace(/\s+/g,"").replace(",",".");
  if(t==="") return NaN;
  const v=Number(t);
  return Number.isFinite(v)?v:NaN;
}
function nearlyEqual(a,b){return Math.abs(a-b) <= 1e-6;}

/* ========= Animation ========= */
let timers=[];
function stopAnimation(){
  timers.forEach(t=>clearTimeout(t));
  timers=[];
  clearMarks();
}
function clearMarks(){
  const bar=document.getElementById("qtyBar");
  if(!bar) return;
  [...bar.querySelectorAll(".part")].forEach(p=>p.classList.remove("highlight","groupHighlight","dim"));
}

/* ========= Compute ========= */
function compute(task){
  const [aa, bb] = simplifyRatio(task.rA, task.rB);
  const knownParts = (task.knownSide==="A") ? aa : bb;
  const askParts   = (task.askSide==="A") ? aa : bb;
  const onePart = task.knownValue / knownParts;
  const result = onePart * askParts;
  return {aa,bb,sum:aa+bb,knownParts,askParts,onePart,result};
}

/* ========= 3-size chooser ========= */
function qtySizeClass(onePart){
  if(onePart < 0.9) return "qtyInnerSmall";
  if(onePart > 1.1) return "qtyInnerLarge";
  return "qtyInnerNormal";
}

/* ========= Colors per task ========= */
function applyTaskColors(task){
  // per Aufgabe setzen (damit Mal-Aufgaben passen)
  document.documentElement.style.setProperty("--A", task.colorA);
  document.documentElement.style.setProperty("--B", task.colorB);
}

/* ========= Verhältnisgleichung als Verhältnis ========= */
function ratioEquation(task, c){
  // Grundverhältnis
  const base = `${task.nameA} : ${task.nameB} = ${c.aa} : ${c.bb}`;

  // Aufgabengleichung so, dass x immer zur gesuchten Seite gehört
  // Fälle:
  // - known=A, ask=B  => knownValue : x = a : b
  // - known=B, ask=A  => x : knownValue = a : b
  // - (askSide immer die andere)
  const knownVal = `${fmt(task.knownValue)}${task.unit}`;
  let eq;

  if(task.knownSide === "A" && task.askSide === "B"){
    eq = `${knownVal} : x = ${c.aa} : ${c.bb}`;
  } else if(task.knownSide === "B" && task.askSide === "A"){
    eq = `x : ${knownVal} = ${c.aa} : ${c.bb}`;
  } else if(task.knownSide === "A" && task.askSide === "A"){
    eq = `x : ${knownVal} = ${c.aa} : ${c.bb}`; // sollte nicht passieren
  } else {
    eq = `${knownVal} : x = ${c.aa} : ${c.bb}`; // fallback
  }

  return { base, eq };
}

/* ========= Render visuals ========= */
function renderTwoBars(vizEl, task){
  const c=compute(task);
  const sum=c.sum;

  const parts=[];
  for(let i=0;i<sum;i++){
    parts.push({cls: i < c.aa ? "partA" : "partB"});
  }

  const knownName = (task.knownSide==="A") ? task.nameA : task.nameB;
  const askName   = (task.askSide==="A") ? task.nameA : task.nameB;

  const sizeCls = qtySizeClass(c.onePart);

  vizEl.innerHTML = `
    <div class="vizTitle">Oben Verhältnis („Teile“), unten Mengen („pro Teil“). Balken 2 ist klein/normal/groß als Hinweis.</div>

    <div class="vizBlock">
      <div class="subTitle">1) Teile-Balken (Verhältnis <b>${c.aa}:${c.bb}</b>)</div>
      <div class="barFrame">
        <div class="barInner">
          <div class="bar" id="ratioBar">
            ${parts.map((p,idx)=>`
              <div class="part ${p.cls}" data-idx="${idx}" style="width:${(100/sum).toFixed(3)}%">
                <div class="num">1</div>
              </div>
            `).join("")}
          </div>
        </div>
      </div>
      <div class="legend">
        <span class="pill"><span class="dot dotA"></span>${task.nameA}: ${c.aa} Teile</span>
        <span class="pill"><span class="dot dotB"></span>${task.nameB}: ${c.bb} Teile</span>
        <span class="tiny">Insgesamt: ${sum} Teile</span>
      </div>
    </div>

    <div class="vizBlock">
      <div class="subTitle">2) Mengen-Balken (bekannt: <b>${knownName} = ${fmt(task.knownValue)}${task.unit}</b>, gesucht: <b>${askName}</b>)</div>

      <div class="barFrame">
        <div class="barInner">
          <div class="${sizeCls}" style="margin:0 auto;">
            <div class="bar" id="qtyBar">
              ${parts.map((p,idx)=>`
                <div class="part ${p.cls}" data-idx="${idx}" style="width:${(100/sum).toFixed(3)}%">
                  <div class="num"></div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      </div>

      <div class="tiny" id="sizeHint" style="margin-top:8px;"></div>
    </div>
  `;

  const sizeHint = document.getElementById("sizeHint");
  const one = c.onePart;
  const tag = (one < 0.9) ? "kleiner" : (one > 1.1) ? "größer" : "normal";
  sizeHint.textContent = `1 Teil = ${fmt(one)}${task.unit} → Mengenbalken ist hier ${tag} (nur als Andeutung).`;

  setAllQtyNumbers("");
}

/* Qty helpers */
function setAllQtyNumbers(val){
  const bar=document.getElementById("qtyBar");
  if(!bar) return;
  [...bar.querySelectorAll(".part .num")].forEach(n=>n.textContent=val);
}
function setQtyNumber(i,val){
  const bar=document.getElementById("qtyBar");
  if(!bar) return;
  const box=bar.querySelector(`.part[data-idx="${i}"] .num`);
  if(box) box.textContent=val;
}
function highlightQtyPart(i){
  const bar=document.getElementById("qtyBar");
  if(!bar) return;
  const p=bar.querySelector(`.part[data-idx="${i}"]`);
  if(p) p.classList.add("highlight");
}
function unhighlightQtyPart(i){
  const bar=document.getElementById("qtyBar");
  if(!bar) return;
  const p=bar.querySelector(`.part[data-idx="${i}"]`);
  if(p) p.classList.remove("highlight");
}
function highlightQtyGroup(indices){
  const bar=document.getElementById("qtyBar");
  if(!bar) return;
  indices.forEach(i=>{
    const p=bar.querySelector(`.part[data-idx="${i}"]`);
    if(p) p.classList.add("groupHighlight");
  });
}
function dimNonGroup(indices){
  const bar=document.getElementById("qtyBar");
  if(!bar) return;
  const set=new Set(indices);
  [...bar.querySelectorAll(".part")].forEach(p=>{
    const i=Number(p.getAttribute("data-idx"));
    if(!set.has(i)) p.classList.add("dim");
  });
}

/* ========= Steps (ohne "Schritt 1: a+b") ========= */
function renderSteps(stepsEl, task){
  const c=compute(task);
  const askName=(task.askSide==="A")?task.nameA:task.nameB;
  const knownName=(task.knownSide==="A")?task.nameA:task.nameB;

  const askClass = (task.askSide==="A") ? "stepAskA" : "stepAskB";
  const eqs = ratioEquation(task, c);

  stepsEl.innerHTML=`
    <div class="stepsTitle">Rechnung (erscheint nach dem Prüfen)</div>
    <div class="stepsGrid">
      <div class="stepBox stepHidden" id="step2Box">
        <div class="stepNr">Schritt 1</div>
        <div class="stepText">Wert pro Teil</div>
        <div class="eq"><span class="hl">${fmt(task.knownValue)}</span> : <span class="hl">${c.knownParts}</span> = <span class="hl">${fmt(c.onePart)}</span>${task.unit}</div>
        <div class="tiny">${knownName} hat ${c.knownParts} Teile.</div>
      </div>

      <div class="stepBox stepHidden ${askClass}" id="step3Box">
        <div class="stepNr">Schritt 2</div>
        <div class="stepText">${askName} berechnen</div>
        <div class="eq"><span class="hl">${fmt(c.onePart)}</span> · <span class="hl">${c.askParts}</span> = <span class="hl">${fmt(c.result)}</span>${task.unit}</div>
        <div class="tiny">${askName} hat ${c.askParts} Teile.</div>
      </div>
    </div>

    <div class="tiny" style="margin-top:10px;">
      <b>Verhältnis:</b> ${eqs.base}<br>
      <b>Verhältnisgleichung:</b> ${eqs.eq}
    </div>
  `;
}
function showStepBox(id){
  const el=document.getElementById(id);
  if(!el) return;
  el.classList.remove("stepHidden");
  el.classList.add("stepShown");
}

/* ========= Animation ========= */
function animateAfterCheck(task){
  stopAnimation();
  const c=compute(task);

  const step2Delay=650;
  const fillDelay =2600;

  timers.push(setTimeout(()=>{
    showStepBox("step2Box");

    // bekannte Gruppe kurz markieren
    const knownIdxs=[];
    if(task.knownSide==="A"){ for(let i=0;i<c.aa;i++) knownIdxs.push(i); }
    else{ for(let i=c.aa;i<c.aa+c.bb;i++) knownIdxs.push(i); }

    clearMarks();
    highlightQtyGroup(knownIdxs);
    dimNonGroup(knownIdxs);
  }, step2Delay));

  timers.push(setTimeout(()=>fillPartsThenFocusAsk(task), fillDelay));
}

function fillPartsThenFocusAsk(task){
  stopAnimation();
  const c=compute(task);

  setAllQtyNumbers("");
  clearMarks();

  const one=fmt(c.onePart);
  const sum=c.sum;

  const startDelay=350;
  const perPartDelay=500;
  const highlightHold=320;

  for(let i=0;i<sum;i++){
    timers.push(setTimeout(()=>{
      clearMarks();
      highlightQtyPart(i);
      setQtyNumber(i, one);
    }, startDelay + i*perPartDelay));

    timers.push(setTimeout(()=>unhighlightQtyPart(i), startDelay + i*perPartDelay + highlightHold));
  }

  const afterFill = startDelay + sum*perPartDelay + 600;

  timers.push(setTimeout(()=>{
    showStepBox("step3Box");

    const askIdxs=[];
    if(task.askSide==="A"){ for(let i=0;i<c.aa;i++) askIdxs.push(i); }
    else{ for(let i=c.aa;i<c.aa+c.bb;i++) askIdxs.push(i); }

    clearMarks();
    highlightQtyGroup(askIdxs);
    dimNonGroup(askIdxs);
  }, afterFill));
}

/* ========= Tasks ========= */
function makeTask({cat,title,context,nameA,nameB,rA,rB,knownSide,knownValue,askSide,unit,colorA,colorB}){
  return {cat,title,context,nameA,nameB,rA,rB,knownSide,knownValue,askSide,unit:unit||"",colorA,colorB};
}

// Farben passend zu Mal-Aufgaben
const COLORS = {
  white: "rgba(235, 235, 235, .95)",   // sichtbar auf weißem Hintergrund
  yellow:"rgba(255, 230, 120, .90)",
  lightblue:"rgba(150, 205, 255, .90)",
  red:"rgba(255, 120, 120, .78)",
  blue:"rgba(120, 170, 255, .78)"
};

const tasks = [
  makeTask({
    cat:"Farbe mischen",
    title:"Aufgabe a)",
    context:"Markus mischt weiße und gelbe Farbe im Verhältnis 5 : 2. Er hat 2 Liter gelbe Farbe. Wie viel weiße Farbe braucht er?",
    nameA:"Weiße Farbe", nameB:"Gelbe Farbe",
    rA:5, rB:2,
    knownSide:"B", knownValue:2,
    askSide:"A",
    unit:" L",
    colorA: COLORS.white,
    colorB: COLORS.yellow
  }),
  makeTask({
    cat:"Farbe mischen",
    title:"Aufgabe b)",
    context:"Sandra mischt hellblaue und weiße Farbe im Verhältnis 3 : 1. Sie hat 0,5 Liter weiße Farbe. Wie viel hellblaue Farbe braucht sie?",
    nameA:"Hellblaue Farbe", nameB:"Weiße Farbe",
    rA:3, rB:1,
    knownSide:"B", knownValue:0.5,
    askSide:"A",
    unit:" L",
    colorA: COLORS.lightblue,
    colorB: COLORS.white
  }),
  makeTask({
    cat:"Erbschaft",
    title:"Aufgabe c)",
    context:"Eine Erbschaft wird zwischen Hanni und Nanni im Verhältnis 3 : 2 aufgeteilt. Hanni bekommt 3000 €. Wie viel erbt Nanni?",
    nameA:"Hanni", nameB:"Nanni",
    rA:3, rB:2,
    knownSide:"A", knownValue:3000,
    askSide:"B",
    unit:" €",
    colorA: COLORS.red,
    colorB: COLORS.blue
  }),
  makeTask({
    cat:"Erbschaft",
    title:"Aufgabe d)",
    context:"Eine Erbschaft wird zwischen Max und Moritz im Verhältnis 9 : 8 aufgeteilt. Moritz erhält 720 €. Wie viel erbt Max?",
    nameA:"Max", nameB:"Moritz",
    rA:9, rB:8,
    knownSide:"B", knownValue:720,
    askSide:"A",
    unit:" €",
    colorA: COLORS.red,
    colorB: COLORS.blue
  })
];

/* ========= UI ========= */
let idx=0, graded=0, correct=0, answered=false;

const scoreEl=document.getElementById("score");
const metaEl=document.getElementById("meta");
const catEl=document.getElementById("cat");
const titleEl=document.getElementById("title");
const textEl=document.getElementById("text");
const vizEl=document.getElementById("viz");
const stepsEl=document.getElementById("steps");
const promptEl=document.getElementById("prompt");
const hintEl=document.getElementById("hint");
const ansEl=document.getElementById("ans");
const unitTag=document.getElementById("unitTag");
const feedbackEl=document.getElementById("feedback");
const checkBtn=document.getElementById("checkBtn");
const nextBtn=document.getElementById("nextBtn");
const restartBtn=document.getElementById("restartBtn");
const animToggle=document.getElementById("animToggle");

function updateTop(){
  scoreEl.textContent=`Richtig: ${correct} / ${graded}`;
  metaEl.textContent=`${idx+1} / ${tasks.length}`;
}

function render(){
  stopAnimation();
  answered=false;
  nextBtn.disabled=true;
  feedbackEl.textContent="";
  ansEl.value="";

  const t=tasks[idx];
  applyTaskColors(t);
  updateTop();

  catEl.textContent=t.cat;
  titleEl.textContent=t.title;
  textEl.textContent=t.context;

  const askName=(t.askSide==="A")?t.nameA:t.nameB;
  promptEl.textContent=`Wie viel ist ${askName}?`;

  unitTag.textContent=t.unit;
  hintEl.textContent="Tipp: Schritt „a+b“ ist oft unnötig, wenn NICHT die Gesamtsumme gegeben ist. Wir rechnen direkt über „pro Teil“.";

  renderTwoBars(vizEl, t);
  renderSteps(stepsEl, t);

  setTimeout(()=>ansEl.focus(), 50);
}

function lockAndRevealSteps(t){
  if(animToggle.checked){
    animateAfterCheck(t);
  }else{
    showStepBox("step2Box");
    showStepBox("step3Box");

    const c=compute(t);
    setAllQtyNumbers(fmt(c.onePart));

    const askIdxs=[];
    if(t.askSide==="A"){ for(let i=0;i<c.aa;i++) askIdxs.push(i); }
    else{ for(let i=c.aa;i<c.aa+c.bb;i++) askIdxs.push(i); }
    highlightQtyGroup(askIdxs);
    dimNonGroup(askIdxs);
  }
}

function check(){
  if(answered) return;

  const t=tasks[idx];
  const c=compute(t);
  const user=parseDE(ansEl.value);

  if(!Number.isFinite(user)){
    feedbackEl.textContent="Bitte eine Zahl eingeben (z.B. 1,5).";
    return;
  }

  answered=true;
  graded++;

  const ok=nearlyEqual(user, c.result);
  if(ok) correct++;

  updateTop();
  lockAndRevealSteps(t);

  const askName=(t.askSide==="A")?t.nameA:t.nameB;
  const right=fmt(c.result)+t.unit;

  feedbackEl.textContent = ok
    ? `Richtig. ${askName}: ${right}`
    : `Falsch. Richtig wäre: ${askName}: ${right}`;

  nextBtn.disabled=false;
}

checkBtn.addEventListener("click", check);
ansEl.addEventListener("keydown", (e)=>{ if(e.key==="Enter") check(); });

nextBtn.addEventListener("click", ()=>{
  idx=(idx+1) % tasks.length;
  render();
});

restartBtn.addEventListener("click", ()=>{
  idx=0; graded=0; correct=0;
  render();
});

render();
</script>
</body>
</html>
